<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OrienRun Admin – Balises & parcours</title>
<meta name="theme-color" content="#0b0b0d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="lib/leaflet/leaflet.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/app.css">

<style id="titre-moderne">/* Titre en casse mixte + logo mis en valeur, aux couleurs du logo */
.top .brand{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif!important;font-style:italic!important;font-weight:900!important;text-transform:none!important;letter-spacing:.005em!important;line-height:1.08;font-size:1.9rem!important;background:none!important;-webkit-text-stroke:0!important;color:#fff!important;-webkit-text-fill-color:#fff!important;text-shadow:0 2px 0 #041a10,0 4px 12px rgba(0,0,0,.45)!important}
.top .brand .tm{background:linear-gradient(180deg,#ffb36b,#fb6b05 72%)!important;-webkit-background-clip:text!important;background-clip:text!important;color:#fb6b05!important;-webkit-text-fill-color:transparent!important;text-shadow:none!important;filter:drop-shadow(0 2px 0 #041a10)}
.top .brand small,.top .brand em{font-style:normal!important;text-shadow:none!important;-webkit-text-fill-color:currentColor!important}
.top .logo img{border-radius:22%!important;box-shadow:0 0 0 2px rgba(255,255,255,.3),0 0 22px rgba(39,217,107,.45),0 6px 16px rgba(0,0,0,.4)!important;transition:transform .3s}
.top .logo img:hover{transform:rotate(-5deg) scale(1.05)}
@media(max-width:520px){.top .brand{font-size:calc(1.9rem * .8)!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="logo" style="background:none;box-shadow:none"><img src="icons/icon-192.png" alt="Logo OrienRun Prof" style="width:100%;height:100%;border-radius:12px"></div><div><div class="brand">Orien<span class="tm">Run</span> Admin</div><div class="sub">Référentiel de balises · parcours · suivi des courses</div></div></div>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
  <div class="note" style="text-align:center;padding:10px" id="verBox"></div>
</div>
<div id="toast" class="toast"></div>
<div id="ov"></div>
<script src="config.js"></script>
<script src="lib/xlsx.full.min.js"></script>
<script src="lib/jspdf.umd.min.js"></script>
<script src="lib/qrcode.js"></script>
<script src="lib/leaflet/leaflet.js"></script>
<script src="js/orun-core.js"></script>
<script src="js/update.js"></script>
<script src="js/labels.js"></script>
<script src="js/app.js"></script>
<script src="js/tabs2.js"></script>
</body>
</html>
